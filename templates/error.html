<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · QuickShare Cloud</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #eff3ff; }
    main { width: min(520px, 90vw); padding: 32px; border: 1px solid #293656; border-radius: 20px; background: #111a2c; text-align: center; }
    p { line-height: 1.7; color: #aab6d0; }
    a { color: #a9bdff; }
  </style>
</head>
<body><main><h1>{{ title }}</h1><p>{{ message }}</p><a href="{{ url_for('index') }}">Return home</a></main></body>
</html>
